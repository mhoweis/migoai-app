# Render Blueprint for the Migo API (apps/backend).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: migo-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:deploy --workspace=@migo/backend
    startCommand: npm run start --workspace=@migo/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The places scraper needs Docker, which Render web services don't have.
      # The API still serves places already cached in the database.
      - key: PLACES_WORKER_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      # Public address of the website, used in links the API sends out.
      - key: APP_PUBLIC_URL
        value: https://migoai-app.vercel.app
      # Values below are entered in the Render dashboard when the Blueprint is created.
      # Required in production; a test key (sk_test_...) works.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Needed for phone sign-up codes (SMS).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
