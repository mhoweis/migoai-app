# Render Blueprint for the Migo API (apps/backend).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: migo-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build:deploy --workspace=@migo/backend
    startCommand: npm run start --workspace=@migo/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Values below are entered in the Render dashboard when the Blueprint is created.
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
